services:
  - type: web
    name: llm-gateway
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GATEWAY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: PROVIDER_ORDER
        value: groq,gemini
      - key: CACHE_TTL_SECONDS
        value: 3600
      - key: RATE_LIMIT_MAX
        value: 30
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: LOG_PATH
        value: ./gateway-requests.jsonl
